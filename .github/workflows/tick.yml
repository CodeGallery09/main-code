name: Advance live plans

# The engine's clock. Vercel's Hobby plan allows one cron a day, which is not a scheduler, so the
# ten-minute beat comes from here instead and `vercel.json` keeps a daily run as a backstop. Both
# call the same endpoint; it is idempotent, so an overlap costs nothing.
#
# **This costs nothing.** Actions minutes are unlimited on a public repository, which this one is.
# If it is ever made private, a free account gets 2,000 minutes a month and this job would spend
# roughly 4,300 of them — so make the schedule hourly, or move the beat to a free external pinger
# (cron-job.org, UptimeRobot) pointed at the same URL with `?token=<secret>`. Either way nothing is
# billed: a free GitHub account has a $0 spending limit, so Actions stops rather than charging.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   FLIGHTPATH_URL     https://your-domain           — no trailing slash
#   FLIGHTPATH_CRON_SECRET                           — the same value as CRON_SECRET in Vercel
#
# Two things GitHub does that are worth knowing: a scheduled workflow only runs from the default
# branch, and GitHub disables the schedule after 60 days with no commits to the repository. If the
# plans ever go quiet, check that first.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: flightpath-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Poke the engine
        env:
          URL: ${{ secrets.FLIGHTPATH_URL }}
          SECRET: ${{ secrets.FLIGHTPATH_CRON_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$SECRET" ]; then
            echo "FLIGHTPATH_URL or FLIGHTPATH_CRON_SECRET is not set — nothing to call."
            exit 1
          fi
          # The secret rides in the header, never the URL, so it stays out of the run log.
          code=$(curl --silent --show-error --fail-with-body \
            --max-time 120 --retry 2 --retry-delay 5 \
            --output /tmp/tick.json --write-out '%{http_code}' \
            -X POST -H "Authorization: Bearer $SECRET" \
            "$URL/api/jobs/tick") || true
          echo "HTTP $code"
          cat /tmp/tick.json || true
          echo
          # 401 or 503 means the secret is wrong or unset on the deployment; that is worth failing on.
          case "$code" in
            200) exit 0 ;;
            *) exit 1 ;;
          esac
